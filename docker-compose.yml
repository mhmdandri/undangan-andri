services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: undangan-andri:latest
    env_file:
      - .env
    ports:
      - "3004:3000"
    restart: unless-stopped
    container_name: undangan-andri
    networks:
      - moha_network

networks:
  moha_network:
    external: true
